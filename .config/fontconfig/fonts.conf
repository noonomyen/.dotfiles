<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- alias: force priority order for sans-serif (Latin first, then fallback to Thai) -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Thai</family>
    </prefer>
  </alias>

  <!-- alias: force priority order for serif (Latin first, then fallback to Thai) -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif Thai</family>
    </prefer>
  </alias>

  <!-- alias: force priority order for monospace (Latin mono first, then fallback to Thai sans-serif) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Thai</family>
    </prefer>
  </alias>

</fontconfig>
