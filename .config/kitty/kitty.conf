# kitty 0.48 -- Wayland / Hyprland
# Noto Sans Mono patched as a Nerd Font; the Mono variant keeps every glyph
# single-width, matching fontconfig's monospace preference. Thai falls back to
# Noto Sans Thai.
font_family        NotoSansM Nerd Font Mono
font_size          11.0
symbol_map U+0E00-U+0E7F Noto Sans Thai

cursor_shape               beam
cursor_beam_thickness      1.5
cursor_blink_interval      0

scrollback_lines 10000

# Remote control over a per-instance abstract socket (kitty @, set-colors)
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

hide_window_decorations yes
window_padding_width    5

# App-level translucency (Hyprland supplies the blur and bypasses its global
# window opacity for terminals, see caelestia/hypr-user.lua)
background_opacity      0.85

enable_audio_bell no

# PageUp/PageDown scroll the scrollback; Ctrl+Shift+F searches it.
map page_up       scroll_page_up
map page_down     scroll_page_down
map ctrl+shift+f  search_scrollback
